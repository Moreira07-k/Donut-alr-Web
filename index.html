<!doctype html>
<html lang=\"pt-BR\">
<head>
  <meta charset=\"UTF-8\" />
  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\" />
  <title>Donut ALR | Delivery de Doces em Floriano 🍩</title>
  <style>
    /* ===== ESTILOS COMPLETOS ===== */
    :root {
      --bg: #fff6f9;
      --card: #fff;
      --pink: #ff6b9d;
      --pink-light: #ffb3d0;
      --rose: #ff4081;
      --peach: #ffd4e8;
      --lavender: #eed6f8;
      --mint: #c8f7e0;
      --mint-dark: #2ecc71;
      --yellow: #fff3b0;
      --brown: #4a2030;
      --brown-mid: #7a4055;
      --brown-light: #b07090;
      --gray: #f7f0f3;
      --gray-2: #eee0e8;
      --text: #2d1020;
      --shadow-sm: 0 2px 8px rgba(200,80,120,0.12);
      --shadow-md: 0 8px 28px rgba(200,80,120,0.18);
      --shadow-lg: 0 12px 36px rgba(200,80,120,0.22);
      --radius-sm: 12px;
      --radius-md: 20px;
      --radius-lg: 30px;
      --font: 'Space Grotesk', system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font);
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      padding-bottom: 80px;
    }

    .header {
      background: var(--card);
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow-sm);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      font-size: 32px;
      animation: spin 6s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .logo-text h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--brown);
    }

    .logo-text p {
      font-size: 12px;
      color: var(--pink);
      font-weight: 500;
    }

    .auth-badge {
      background: var(--peach);
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      color: var(--brown);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Container */
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Produtos e Grid */
    .products-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 20px;
    }

    .product-card {
      background: var(--card);
      border-radius: var(--radius-md);
      padding: 12px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .product-img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      background: var(--gray);
    }

    .product-info {
      margin-top: 10px;
      flex-grow: 1;
    }

    .product-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--brown);
    }

    .product-price {
      font-size: 16px;
      color: var(--rose);
      font-weight: 700;
      margin-top: 4px;
    }

    .add-btn {
      background: var(--pink);
      color: white;
      border: none;
      padding: 8px;
      border-radius: var(--radius-sm);
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      width: 100%;
    }

    /* Carrinho Fixo Abaixo */
    .cart-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 40px);
      max-width: 560px;
      background: var(--brown);
      color: white;
      padding: 16px 24px;
      border-radius: var(--radius-md);
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow-lg);
      z-index: 99;
      cursor: pointer;
    }

    /* Modais Estilizados Simplificados */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(45, 16, 32, 0.5);
      z-index: 1000;
      justify-content: center;
      align-items: flex-end;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--card);
      width: 100%;
      max-width: 600px;
      border-top-left-radius: var(--radius-lg);
      border-top-right-radius: var(--radius-lg);
      padding: 24px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--gray-2);
      border-radius: var(--radius-sm);
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--pink);
    }

    .primary-btn {
      background: var(--rose);
      color: white;
      border: none;
      padding: 14px;
      border-radius: var(--radius-sm);
      width: 100%;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="logo-container">
      <div class="logo-icon">🍩</div>
      <div class="logo-text">
        <h1>Donut ALR</h1>
        <p>Floriano, PI</p>
      </div>
    </div>
    <div class="auth-badge" id="authBadge" onclick="abrirModalAuth()">👤 Fazer Login</div>
  </header>

  <main class="container">
    <h2>Nosso Cardápio 🌟</h2>
    <div class="products-grid" id="produtosContainer">
      </div>
  </main>

  <div class="cart-bar" id="cartBar" style="display: none;" onclick="abrirModalCarrinho()">
    <div>
      <span id="cartCount">0</span> itens no carrinho
    </div>
    <strong id="cartTotal">R$ 0,00 🛒</strong>
  </div>

  <div class="modal" id="authModal">
    <div class="modal-content">
      <h3 style="margin-bottom: 16px;">Entre ou Cadastre-se 🍩</h3>
      <div class="form-group">
        <label>Seu Nome</label>
        <input type="text" id="authNome" placeholder="Ex: João Silva">
      </div>
      <div class="form-group">
        <label>WhatsApp</label>
        <input type="tel" id="authTelefone" placeholder="Ex: 89999999999">
      </div>
      <div class="form-group">
        <label>E-mail (Opcional)</label>
        <input type="email" id="authEmail" placeholder="Ex: joao@email.com">
      </div>
      <button class="primary-btn" onclick="realizarCadastroCliente()">Salvar e Continuar</button>
      <button class="add-btn" style="background:transparent; color:var(--text);" onclick="fecharModalAuth()">Cancelar</button>
    </div>
  </div>

  <div class="modal" id="cartModal">
    <div class="modal-content">
      <h3>Seu Carrinho 🛒</h3>
      <div id="carrinhoItens" style="margin: 16px 0;"></div>
      
      <div class="form-group">
        <label>Endereço de Entrega</label>
        <input type="text" id="cartEndereco" placeholder="Rua, Número, Bairro">
      </div>

      <div class="form-group">
        <label>Forma de Pagamento</label>
        <select id="cartPagamento">
          <option value="Pix">Pix</option>
          <option value="Cartão de Crédito/Débito">Cartão</option>
          <option value="Dinheiro">Dinheiro</option>
        </select>
      </div>

      <button class="primary-btn" onclick="finalizarPedidoCheckout()">Enviar Pedido 🚀</button>
      <button class="add-btn" style="background:transparent; color:var(--text);" onclick="fecharModalCarrinho()">Continuar Comprando</button>
    </div>
  </div>

  <script>
    // Banco de Dados Compartilhado
    const DB_NAME = 'DonutALR_DB';
    const DB_VERSION = 1;
    let dbAdmin = null;

    // Conectar ao IndexedDB do Admin
    function conectarBanco() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onerror = () => reject(request.error);
        request.onsuccess = () => {
          dbAdmin = request.result;
          resolve(dbAdmin);
        };
      });
    }

    // Dados Locais do App
    const PRODUTOS = [
      { id: 1, nome: "Donut Clássico Homer", preco: 8.50 },
      { id: 2, nome: "Donut Chocolate Belga", preco: 10.00 },
      { id: 3, nome: "Donut Ninho com Nutella", preco: 12.00 },
      { id: 4, nome: "Donut Sensação", preco: 11.50 }
    ];

    let carrinho = [];
    let usuarioAtual = JSON.parse(localStorage.getItem("usuario_donut")) || null;

    document.addEventListener("DOMContentLoaded", () => {
      conectarBanco().then(() => console.log("Sincronizado com IndexedDB do Admin!")).catch(e => console.error(e));
      renderProdutos();
      atualizarBadgeUsuario();
    });

    function renderProdutos() {
      const container = document.getElementById("produtosContainer");
      container.innerHTML = PRODUTOS.map(p => `
        <div class="product-card">
          <div class="product-info">
            <div class="product-title">${p.nome}</div>
            <div class="product-price">R$ ${p.preco.toFixed(2)}</div>
          </div>
          <button class="add-btn" onclick="adicionarAoCarrinho(${p.id})">Adicionar</button>
        </div>
      `).join('');
    }

    function adicionarAoCarrinho(id) {
      const produto = PRODUTOS.find(p => p.id === id);
      const item = carrinho.find(c => c.id === id);
      if (item) {
        item.qtd++;
      } else {
        carrinho.push({ ...produto, qtd: 1 });
      }
      atualizarCarrinhoBar();
    }

    function atualizarCarrinhoBar() {
      const bar = document.getElementById("cartBar");
      if (carrinho.length === 0) {
        bar.style.display = "none";
        return;
      }
      bar.style.display = "flex";
      const totalItens = carrinho.reduce((acc, i) => acc + i.qtd, 0);
      const valorTotal = carrinho.reduce((acc, i) => acc + (i.preco * i.qtd), 0);
      
      document.getElementById("cartCount").innerText = totalItens;
      document.getElementById("cartTotal").innerText = `R$ ${valorTotal.toFixed(2)} 🛒`;
    }

    function abrirModalAuth() { document.getElementById("authModal").classList.add("active"); }
    function fecharModalAuth() { document.getElementById("authModal").classList.remove("active"); }
    function abrirModalCarrinho() { 
      document.getElementById("cartModal").classList.add("active"); 
      const container = document.getElementById("carrinhoItens");
      container.innerHTML = carrinho.map(i => `<div>${i.nome} x${i.qtd} - R$ ${(i.preco*i.qtd).toFixed(2)}</div>`).join('');
    }
    function fecharModalCarrinho() { document.getElementById("cartModal").classList.remove("active"); }

    function atualizarBadgeUsuario() {
      if (usuarioAtual) {
        document.getElementById("authBadge").innerText = `🙋‍♂️ Olá, ${usuarioAtual.nome.split(' ')[0]}`;
      }
    }

    // ==========================================
    // AÇÃO DE CADASTRO -> INJETA NO ADMIN
    // ==========================================
    function realizarCadastroCliente() {
      const nome = document.getElementById("authNome").value.trim();
      const telefone = document.getElementById("authTelefone").value.trim();
      const email = document.getElementById("authEmail").value.trim() || "nao@informado.com";

      if (!nome || !telefone) {
        alert("Por favor, digite nome e WhatsApp!");
        return;
      }

      usuarioAtual = { nome, telefone, email };
      localStorage.setItem("usuario_donut", JSON.stringify(usuarioAtual));
      atualizarBadgeUsuario();

      // Grava no IndexedDB para o Painel Administrativo ler
      if (dbAdmin) {
        const transaction = dbAdmin.transaction(['users'], 'readwrite');
        const store = transaction.objectStore('users');
        store.add({
          nome: nome,
          email: email,
          telefone: telefone,
          role: 'cliente',
          data: new Date().toLocaleDateString('pt-BR')
        });
      }

      fecharModalAuth();
      alert("Cadastro efetuado com sucesso!");
    }

    // ==========================================
    // AÇÃO DE PEDIDO -> INJETA NO ADMIN
    // ==========================================
    function finalizarPedidoCheckout() {
      if (carrinho.length === 0) return;

      const endereco = document.getElementById("cartEndereco").value.trim();
      const pagamento = document.getElementById("cartPagamento").value;

      if (!endereco) {
        alert("Por favor, informe seu endereço de entrega!");
        return;
      }

      const total = carrinho.reduce((acc, i) => acc + (i.preco * i.qtd), 0);

      const novoPedido = {
        cliente: usuarioAtual?.nome || 'Cliente Balcão',
        email: usuarioAtual?.email || 'nao@informado.com',
        whatsapp: usuarioAtual?.telefone || 'não informado',
        itens: carrinho.map(i => ({ nome: i.nome, qtd: i.qtd, preco: i.preco })),
        total: total,
        endereco: endereco,
        pagamento: pagamento,
        status: 'pending',
        data: new Date().toLocaleString('pt-BR')
      };

      // SALVA NO INDEXEDDB DO ADMIN
      if (dbAdmin) {
        const transaction = dbAdmin.transaction(['pedidos'], 'readwrite');
        const store = transaction.objectStore('pedidos');
        store.add(novoPedido);
        
        // Gera log automático
        const logStore = transaction.objectStore ? dbAdmin.transaction(['logs'], 'readwrite').objectStore('logs') : null;
        if (logStore) logStore.add({ data: new Date().toLocaleString('pt-BR'), usuario: novoPedido.cliente, acao: 'Novo Pedido', detalhes: `Comprou R$ ${total.toFixed(2)}` });
      }

      // Abre WhatsApp para experiência real do usuário
      const msg = `Olá! Meu pedido de Donut no valor de R$ ${total.toFixed(2)} foi enviado para o painel!`;
      window.open(`https://wa.me/5589999999999?text=${encodeURIComponent(msg)}`, '_blank');

      // Reseta tudo
      carrinho = [];
      atualizarCarrinhoBar();
      fecharModalCarrinho();
      alert("Pedido enviado com sucesso para o Painel Administrativo!");
    }
  </script>
</body>
</html>
